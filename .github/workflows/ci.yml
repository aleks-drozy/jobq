name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: raft simulation, 10000 seeds
        run: go test -count=1 -run 'TestSimulation$' ./raft -raft.sims=10000
      - name: cluster crash harness, 5 more runs
        run: go test -count=5 -run 'TestClusterLosesNothing' ./cmd/jobqd
      - name: standard library only
        run: |
          deps="$(go list -m all | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "root module has non-stdlib dependencies (it must not):"
            echo "$deps"
            exit 1
          fi

  # The Terraform was written without a Terraform binary to hand. This is
  # the only place it is checked at all, and it checks syntax and types,
  # not that it builds what it claims: nothing here touches AWS.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive -diff deploy/terraform
      - name: validate cluster
        working-directory: deploy/terraform
        # main.tf hashes the jobqd binary it uploads; give it one to find.
        run: |
          mkdir -p build && : > build/jobqd
          terraform init -backend=false -input=false
          terraform validate
      - name: validate budget
        working-directory: deploy/terraform/budget
        run: terraform init -backend=false -input=false && terraform validate

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
